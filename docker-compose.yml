services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: simplepoker
      POSTGRES_PASSWORD: simplepoker
      POSTGRES_DB: simplepoker
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simplepoker"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://simplepoker:simplepoker@db:5432/simplepoker
      NODE_ENV: development
      # Só para dev local — em produção, defina uma própria (32+ caracteres).
      SESSION_SECRET: "dev-apenas-troque-em-producao-0057b8f2a9975acdf4c34e1fb1c5b830"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    depends_on:
      db:
        condition: service_healthy
    # Aplica as migrations pendentes antes de subir o dev server, pra um
    # `docker-compose up` sempre partir de um banco com o schema em dia.
    command: sh -c "npm run migrate:up && npm run dev -- -H 0.0.0.0"

volumes:
  db-data:
  node_modules:
  next_cache:
